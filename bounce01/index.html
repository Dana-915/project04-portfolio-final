
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Switcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Image Switcher</h1>
        <p>Click the button to change the picture.</p>
    </header>

    <main>
        <section class="image-container">
            <img
                id="gallery-image"
                src="assets/IMG_8052.jpeg"
                alt="First displayed image"
            >

            <p id="image-description">Image 1 of 2</p>

            <button type="button" id="change-image">
                Next Image
            </button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Personal Portfolio</p>
    </footer>

</body>
</html>
